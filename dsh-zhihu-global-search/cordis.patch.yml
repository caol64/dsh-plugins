# Bundle patch layer for dsh-zhihu-global-search.
#
# The row loads this package into the host, which registers the
# `zhihu_global_search` native tool, and (on the web client) the settings page
# under Settings → Zhihu global search.
#
# Credentials are never part of this row. The Access Secret lives in THIS
# plugin's own store, `<DSH_HOME>/storages/dsh-zhihu-global-search/secret.json`
# (directory 0700, file 0600, atomic writes), which the settings page writes and
# nothing else reads. The machine-wide `.credentials.yaml` is never touched, so
# removing this plugin's store directory removes the secret with it.
# `accessSecretEnv` (default `ZHIHU_ACCESS_SECRET`) names an OPTIONAL read-only
# fallback: a stored value always wins over it.
# A row that carries a literal secret key is rejected at activation.
#
# Every config key has a default and can be omitted. Override values in the
# profile's own patch file (`~/.dsh/profiles/web/cordis.patch.yml`) with a row
# that targets `id: zhihu-global-search` and lists ONLY the keys to change:
#
#   - id: zhihu-global-search
#     config:
#       secretStoreDir: /absolute/path/to/store
#
# `secretStoreDir` is optional; leave it out to use the default above. Point it
# elsewhere only when one machine runs several isolated instances.
#
# Do not restate the whole config there: the config object is replaced, not
# merged, so a partial row silently resets the other keys to their defaults.
- insert:
    - id: zhihu-global-search
      name: dsh-zhihu-global-search