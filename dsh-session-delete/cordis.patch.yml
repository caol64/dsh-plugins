# Bundle patch layer for dsh-session-delete.
#
# The row loads this package into the host, which serves the `delete` package
# RPC method and drops the target Session from the API row feed; the web client
# half contributes "Delete session" at the bottom of the sidebar Session menu.
#
# Every config key has a default, so the row can stay as written here. Override
# values in the profile's own patch file
# (`~/.dsh/profiles/web/cordis.patch.yml`) with a row that targets
# `id: session-delete` and lists ONLY the keys to change:
#
#   - id: session-delete
#     config:
#       stopTimeoutMs: 15000
#
# Do not restate the whole config there: a matching override replaces the
# complete config object rather than merging into it, so a partial row would
# silently reset every other key to its default.
- insert:
    - id: session-delete
      name: dsh-session-delete